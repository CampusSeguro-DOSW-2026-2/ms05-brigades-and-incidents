
name: CI - calidad y contenedores

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Java - pruebas, cobertura y SpotBugs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: brigades_incidents_db
          POSTGRES_USER: campusseguro
          POSTGRES_PASSWORD: campusseguro_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusseguro -d brigades_incidents_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/brigades_incidents_db
      SPRING_DATASOURCE_USERNAME: campusseguro
      SPRING_DATASOURCE_PASSWORD: campusseguro_ci_only
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      JWT_SECRET: test-only-long-nonproduction-secret-please-do-not-use
      EVIDENCIAS_DIRECTORIO: /tmp/evidencias

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar, ejecutar pruebas y verificar calidad
        run: ./mvnw -B -ntp clean verify

      - name: Guardar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  publish-backend-image:
    name: Publicar imagen del backend en GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-quality]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Identificar imagen y etiqueta
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar imagen Spring Boot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
