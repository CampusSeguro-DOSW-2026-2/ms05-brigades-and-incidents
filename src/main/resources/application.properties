spring.application.name=brigades-and-incidents

# Database connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/brigades_incidents_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campusseguro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ms05_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# Evidencias: una foto de camara supera el limite por defecto de 1 MB. Se aceptan hasta 15 MB por archivo y 20 MB
# por solicitud; max-swallow-size permite terminar de leer el cuerpo cuando se rechaza, sin cortar la conexion.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-swallow-size=20MB

# SQL initialization
spring.sql.init.mode=never

# Integracion con MS01 a traves del API Gateway
campusseguro.ms01.base-url=${MS05_GATEWAY_URL:http://localhost:8080}
campusseguro.ms01.service-key=${GW_SERVICE_KEY_MS05:}

# Integracion con MS02 a traves del API Gateway (Estandares §5), con la misma clave de servicio
campusseguro.ms02.base-url=${MS05_GATEWAY_URL:http://localhost:8080}
campusseguro.ms02.service-key=${GW_SERVICE_KEY_MS05:}

# Integracion con MS03 a traves del API Gateway: avisos (correo) al brigadista asignado a una solicitud
campusseguro.ms03.base-url=${MS05_GATEWAY_URL:http://localhost:8080}
campusseguro.ms03.service-key=${GW_SERVICE_KEY_MS05:}

# Integracion con MS08 a traves del API Gateway: envio de hechos de auditoria y analitica 
campusseguro.ms08.base-url=${MS05_GATEWAY_URL:http://localhost:8080}
campusseguro.ms08.service-key=${GW_SERVICE_KEY_MS05:}

# Evidence storage
evidencias.directorio=${EVIDENCIAS_DIRECTORIO:./uploads/evidencias}

# Server: puerto interno de MS05 (Estandares §2)
server.port=${SERVER_PORT:8085}

# Health (Estandares §11): solo /actuator/health con {"status":"UP"} o {"status":"DOWN"}, sin detalles
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false