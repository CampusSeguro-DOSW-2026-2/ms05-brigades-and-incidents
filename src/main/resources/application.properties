spring.application.name=brigades-and-incidents

# Database connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/brigades_incidents_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campusseguro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ms05_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# SQL initialization
spring.sql.init.mode=never

# Integracion con MS01 a traves del API Gateway
campusseguro.ms01.base-url=${MS05_GATEWAY_URL:http://localhost:8080}
campusseguro.ms01.service-key=${GW_SERVICE_KEY_MS05:}

# Evidence storage
evidencias.directorio=${EVIDENCIAS_DIRECTORIO:./uploads/evidencias}

# Server
server.port=${SERVER_PORT:8080}