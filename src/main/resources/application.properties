spring.application.name=brigades-and-incidents

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5435/brigades_incidents_db
spring.datasource.username=campusseguro
spring.datasource.password=ms05_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# SQL initialization
spring.sql.init.mode=always

# Integracion con MS01 a traves del API Gateway
campusseguro.ms01.base-url=${MS05_GATEWAY_URL:http://localhost:8080}
campusseguro.ms01.service-key=${GW_SERVICE_KEY_MS05:}