
name: CI - calidad y contenedores

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Java - pruebas, cobertura y SpotBugs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: brigades_incidents_db
          POSTGRES_USER: campusseguro
          POSTGRES_PASSWORD: campusseguro_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusseguro -d brigades_incidents_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/brigades_incidents_db
      SPRING_DATASOURCE_USERNAME: campusseguro
      SPRING_DATASOURCE_PASSWORD: campusseguro_ci_only
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      JWT_SECRET: test-only-long-nonproduction-secret-please-do-not-use
      EVIDENCIAS_DIRECTORIO: /tmp/evidencias

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar, ejecutar pruebas y verificar calidad
        run: ./mvnw -B -ntp clean verify

      - name: Guardar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  # Publica la imagen en GHCR desde develop y main: develop -> :develop, main -> :latest, y cada una con
  # :sha-xxxxxxx (los 7 primeros caracteres del commit), la etiqueta que despliegan deploy.yml y deploy-prod.yml.
  publish-backend-image:
    name: Publicar imagen del backend en GHCR
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [backend-quality]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha

      - name: Construir y publicar imagen Spring Boot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD al entorno de prueba: cada push a develop despliega en la VM de MS05 la imagen recién publicada.
  desplegar-test:
    needs: publish-backend-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      entorno: test
      ref: ${{ github.sha }}
    secrets: inherit
