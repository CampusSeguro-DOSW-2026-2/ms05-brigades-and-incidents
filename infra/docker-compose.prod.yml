# Stack de MS05 en la nube: uno por entorno en la misma VM (ms05-prod y ms05-test), cada uno con sus evidencias.
# La base de datos NO vive en el stack: es una instancia administrada (RDS) fuera de la VM y se alcanza por su
# endpoint con TLS. No publica puertos: solo el Caddy de borde de la VM (red campus-edge) llega a MS05, con el
# alias ms05-<entorno>. Lo usa infra/deploy.sh con el .env que escribe en DEPLOY_DIR/<entorno>; no se ejecuta a mano.
name: ms05-${ENTORNO:?ENTORNO es obligatoria (test o prod)}

services:
  ms05:
    image: ${IMAGE:?IMAGE es obligatoria}:${TAG:?TAG es obligatoria (sha-xxxxxxx)}
    restart: unless-stopped
    environment:
      # Base administrada (RDS). TLS obligatorio: con `rds.force_ssl=1` una conexión sin
      # cifrar se rechaza, así que la URL debe llevar `sslmode=require`.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL es obligatoria (jdbc:postgresql://<endpoint>:5432/<base>?sslmode=require)}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME es obligatoria (ms05_user o ms05_prod)}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD es obligatoria}
      SPRING_JPA_SHOW_SQL: "false"
      SERVER_PORT: "8085"
      # Llamadas a MS01, MS02, MS03 y MS08 a través del Gateway, con la clave de MS05 (Estándares §5)
      MS05_GATEWAY_URL: ${GATEWAY_URL:?GATEWAY_URL es obligatoria (https://<dominio del GW> o :8443)}
      GW_SERVICE_KEY_MS05: ${GATEWAY_SERVICE_KEY:?GATEWAY_SERVICE_KEY es obligatoria}
      EVIDENCIAS_DIRECTORIO: /app/uploads/evidencias
    # Variables opcionales del entorno, si las hay.
    env_file:
      - path: extra.env
        required: false
    volumes:
      - evidencias:/app/uploads/evidencias
    networks:
      edge:
        aliases:
          - ms05-${ENTORNO}

volumes:
  evidencias:

networks:
  edge:
    name: campus-edge
    external: true
