# Entorno local de prueba de MS05 (gestión de brigadistas y auto asignación).
# Solo las bases de datos van en Docker; MS01, el Gateway, MS05 y el frontend corren en la máquina (ver README.md).
name: campusseguro-local-ms05

services:
  ms01-db:
    image: postgres:17-alpine
    container_name: local-ms01-db
    environment:
      POSTGRES_DB: campus_db
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_password
    ports:
      - "5442:5432"
    volumes:
      - ../../Login/login/database/001_create_schema.sql:/docker-entrypoint-initdb.d/001_create_schema.sql:ro
      - ../../Login/login/database/002_index_schema.sql:/docker-entrypoint-initdb.d/002_index_schema.sql:ro
      - ../../Login/login/database/003_codigos_recuperacion.sql:/docker-entrypoint-initdb.d/003_codigos_recuperacion.sql:ro
      - ./sql/ms01-usuarios-prueba.sql:/docker-entrypoint-initdb.d/900_usuarios_prueba.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  ms05-db:
    image: postgres:17-alpine
    container_name: local-ms05-db
    environment:
      POSTGRES_DB: brigades_incidents_db
      POSTGRES_USER: campusseguro
      POSTGRES_PASSWORD: ms05_dev_password
    ports:
      - "5435:5432"
    volumes:
      # Mismo orden que infra/db/01-initialize-ms05.sh (se montan los .sql para no depender de los finales de línea del .sh)
      - ../database/init/01-create-tables.sql:/docker-entrypoint-initdb.d/01-create-tables.sql:ro
      - ../database/init/02-insert-catalogs.sql:/docker-entrypoint-initdb.d/02-insert-catalogs.sql:ro
      - ../database/migrations/V2__gestion_atencion_incidentes.sql:/docker-entrypoint-initdb.d/03-V2.sql:ro
      - ../database/migrations/V3__eliminacion_logica_incidentes.sql:/docker-entrypoint-initdb.d/04-V3.sql:ro
      - ../database/migrations/V4__crear_registro_auditoria.sql:/docker-entrypoint-initdb.d/05-V4.sql:ro
      - ../database/migrations/V5__datos_evento_autoasignacion.sql:/docker-entrypoint-initdb.d/06-V5.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusseguro -d brigades_incidents_db"]
      interval: 3s
      timeout: 3s
      retries: 20
